name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "GitHub secret RENDER_HEALTH_URL 이 없습니다."
            echo "예: https://your-service.onrender.com/health"
            exit 1
          fi
          curl -fsS --retry 3 --retry-all-errors --max-time 90 "$HEALTH_URL"
